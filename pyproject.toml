[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptforge"
version = "0.1.0"
description = "A tiny Jinja2-based prompt template manager for LLM applications."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SuHong615" }]
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["promptforge*"]